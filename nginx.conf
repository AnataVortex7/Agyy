user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_max_body_size 0;

    server {
        listen 8000;

        # Small helper page: shows the last OAuth / login URL agy printed
        # in the terminal, fully un-wrapped, with a big "Copy" button.
        location = /oauth-link {
            alias /root/oauth_link.html;
            default_type text/html;
        }

        # JSON the page above polls every couple seconds.
        location = /oauth-link/data.json {
            alias /root/oauth_data.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        # Everything else -> the real terminal (ttyd), which we run
        # internally on 127.0.0.1:7681 instead of the public port.
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
