<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login link</title>
<style>
  body { font-family: -apple-system, Roboto, sans-serif; background:#1e1e1e; color:#eee; margin:0; padding:20px; }
  h2 { font-size: 18px; font-weight: 600; }
  textarea { width:100%; box-sizing:border-box; height:140px; background:#111; color:#9cdcfe;
             border:1px solid #444; border-radius:8px; padding:12px; font-size:14px; word-break:break-all; }
  button { width:100%; padding:16px; font-size:18px; border:none; border-radius:8px; margin-top:12px;
           background:#4285F4; color:white; font-weight:600; }
  button:active { background:#3367d6; }
  #status { margin-top:10px; font-size:14px; color:#8bc34a; min-height:20px; }
  #empty { color:#999; font-size:14px; }
  a.open { display:block; text-align:center; margin-top:10px; color:#8ab4f8; }
</style>
</head>
<body>
  <h2>Latest login / OAuth link from the terminal</h2>
  <div id="empty">Waiting for a link to appear in the terminal…</div>
  <div id="content" style="display:none">
    <textarea id="urlBox" readonly></textarea>
    <button onclick="copyIt()">Copy link</button>
    <a class="open" id="openLink" href="#" target="_blank">Open it directly instead →</a>
    <div id="status"></div>
  </div>

<script>
let lastUrl = null;

async function poll() {
  try {
    const res = await fetch('/oauth-link/data.json?_=' + Date.now());
    const data = await res.json();
    if (data.url && data.url !== lastUrl) {
      lastUrl = data.url;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('urlBox').value = data.url;
      document.getElementById('openLink').href = data.url;
    }
  } catch (e) { /* ignore, try again next tick */ }
}

async function copyIt() {
  const box = document.getElementById('urlBox');
  const status = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(box.value);
    status.textContent = 'Copied ✓ — now paste it in a browser tab.';
  } catch (e) {
    // Fallback for older mobile browsers without Clipboard API access.
    box.removeAttribute('readonly');
    box.focus();
    box.select();
    document.execCommand('copy');
    box.setAttribute('readonly', 'true');
    status.textContent = 'Copied ✓ — now paste it in a browser tab.';
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
